<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · GEA Insumos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<!-- Las @font-face viven adentro de estilos.css, así que el panel no pide nada a
     fonts.googleapis.com. Los .woff2 siguen saliendo de gstatic. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Uno solo, igual que la tienda: lo arma herramientas/compilar.mjs con los
     mismos tokens más admin.css. -->
<link rel="stylesheet" href="estilos.css">
<script>
/* Mismo criterio que la tienda: el tema se estampa antes de pintar. */
(function () {
  var v = {};
  try { v = JSON.parse(localStorage.getItem("gea_ver_v1")) || {}; } catch (e) {}
  var attr = { claro: "light", oscuro: "dark" }[v.tema];
  if (attr) document.documentElement.setAttribute("data-theme", attr);
})();
</script>
</head>
<body>
<div id="raiz"></div>
<!-- El mismo React que la tienda, del propio dominio. Los baja y los verifica
     herramientas/vendor.mjs contra el sha384 que tenían de integrity. -->
<!-- Con defer, igual que la tienda: conserva el orden —panel.js necesita React
     ya cargado— y deja de frenar al parser. -->
<script defer src="../vendor/react-18.3.1.min.js"></script>
<script defer src="../vendor/react-dom-18.3.1.min.js"></script>
<script defer src="panel.js"></script>
</body></html>
