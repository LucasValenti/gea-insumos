<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · GEA Insumos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="admin.css">
<script>
/* Mismo criterio que la tienda: el tema se estampa antes de pintar. */
(function () {
  var v = {};
  try { v = JSON.parse(localStorage.getItem("gea_ver_v1")) || {}; } catch (e) {}
  var attr = { claro: "light", oscuro: "dark" }[v.tema];
  if (attr) document.documentElement.setAttribute("data-theme", attr);
})();
</script>
</head>
<body>
<div id="raiz"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">
(() => {
const { useState, useEffect, useCallback } = React;

const api = async (ruta, opciones = {}) => {
  const r = await fetch("/api/admin" + ruta, {
    headers: { "content-type": "application/json" },
    ...opciones,
    body: opciones.cuerpo ? JSON.stringify(opciones.cuerpo) : undefined,
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Falló el pedido (" + r.status + ")");
  return d;
};

const plata = (n) => (typeof n === "number" ? "$ " + n.toLocaleString("es-AR") : "");

/* ---------- ingreso ---------- */
function Entrar({ onEntro }) {
  const [clave, setClave] = useState("");
  const [error, setError] = useState(null);
  const [yendo, setYendo] = useState(false);

  const enviar = async (e) => {
    e.preventDefault();
    setYendo(true); setError(null);
    try { await api("/entrar", { method: "POST", cuerpo: { contrasena: clave } }); onEntro(); }
    catch (err) { setError(err.message); setClave(""); }
    finally { setYendo(false); }
  };

  return (
    <main className="pa-entrar">
      <h1>Panel de GEA</h1>
      <p>Para cargar productos, precios y stock.</p>
      <form onSubmit={enviar}>
        <div className="pa-campo">
          <label htmlFor="clave">Contraseña</label>
          <input id="clave" type="password" value={clave} autoComplete="current-password"
            onChange={(e) => setClave(e.target.value)} autoFocus />
        </div>
        {error && <div className="pa-aviso mal" role="alert">{error}</div>}
        <button className="btn btn-primary" type="submit" disabled={yendo || !clave}
          style={{ minHeight: 48, width: "100%" }}>
          {yendo ? "Entrando…" : "Entrar"}
        </button>
      </form>
    </main>
  );
}

/* ---------- control de stock reutilizable ---------- */
function Stock({ valor, onGuardar }) {
  const [n, setN] = useState(valor);
  const [estado, setEstado] = useState(null);
  useEffect(() => { setN(valor); }, [valor]);

  const mandar = useCallback(async (nuevo) => {
    setN(nuevo); setEstado("yendo");
    try { await onGuardar(nuevo); setEstado("ok"); setTimeout(() => setEstado(null), 1200); }
    catch (e) { setEstado("mal"); setN(valor); }
  }, [onGuardar, valor]);

  return (
    <span className="pa-paso">
      <button type="button" onClick={() => mandar(Math.max(0, n - 1))} disabled={n <= 0}
        aria-label="Restar uno">–</button>
      <input type="number" min="0" value={n} inputMode="numeric"
        onChange={(e) => setN(Math.max(0, Number(e.target.value) || 0))}
        onBlur={() => n !== valor && mandar(n)}
        aria-label="Stock"
        style={estado === "mal" ? { borderColor: "var(--acento)" } : estado === "ok" ? { borderColor: "var(--ok)" } : undefined} />
      <button type="button" onClick={() => mandar(n + 1)} aria-label="Sumar uno">+</button>
    </span>
  );
}

/* ---------- campo de formulario reutilizable ---------- */
function Campo({ id, etiqueta, ayuda, children }) {
  return (
    <div className="pa-campo">
      <label htmlFor={id}>{etiqueta}</label>
      {children}
      {ayuda && <span className="ayuda">{ayuda}</span>}
    </div>
  );
}

/* ---------- borrar, en dos toques ----------
   Un window.confirm en el celular sale como un cartel del navegador que se
   descarta de un roce. Acá el botón se convierte en la pregunta, y hay que
   apuntarle al "sí" a propósito. */
function Borrar({ que, onBorrar, children }) {
  const [preguntando, setPreguntando] = useState(false);
  const [yendo, setYendo] = useState(false);

  if (!preguntando) return (
    <button type="button" className="pa-borrar" onClick={() => setPreguntando(true)}>{children}</button>
  );
  return (
    <span className="pa-confirma" role="group" aria-label={"Confirmar borrado de " + que}>
      <span>¿Borro {que}?</span>
      <button type="button" className="pa-borrar" disabled={yendo}
        onClick={async () => { setYendo(true); try { await onBorrar(); } finally { setYendo(false); setPreguntando(false); } }}>
        {yendo ? "Borrando…" : "Sí, borrar"}
      </button>
      <button type="button" className="pa-cancela" onClick={() => setPreguntando(false)}>No</button>
    </span>
  );
}

/* ---------- tonos de un producto ---------- */
const HEX_NUEVO = "#c4756b";

function Tonos({ p, familias, recargar, avisar }) {
  const [nuevo, setNuevo] = useState(null);   // null = el formulario está cerrado
  const [error, setError] = useState(null);

  const guardarStock = (t) => async (n) => {
    await api("/tono/" + p.id, { method: "PATCH", cuerpo: { nombre: t.nombre, stock: n } });
    avisar(`${p.nombre} · ${t.nombre}: ${n}`);
    recargar();
  };

  const agregar = async () => {
    setError(null);
    try {
      await api("/tono/" + p.id, { method: "POST", cuerpo: nuevo });
      avisar(`Tono agregado: ${nuevo.nombre}`);
      setNuevo(null);
      recargar();
    } catch (e) { setError(e.message); }
  };

  const quitar = (t) => async () => {
    try {
      await api(`/tono/${p.id}?nombre=${encodeURIComponent(t.nombre)}`, { method: "DELETE" });
      avisar(`Tono borrado: ${t.nombre}`);
      recargar();
    } catch (e) { setError(e.message); }
  };

  return (
    <div className="pa-tonos">
      <p className="pa-sub">Tonos</p>
      {!p.tonos.length && <p className="ayuda">Este producto no tiene tonos: el stock se lleva de a uno.</p>}
      {p.tonos.map((t) => (
        <div className="pa-tono" key={t.nombre}>
          <s style={{ background: t.hex }}></s>
          <span className="pa-tono-nom">{t.nombre}</span>
          <Stock valor={t.stock} onGuardar={guardarStock(t)} />
          <Borrar que={"el tono " + t.nombre} onBorrar={quitar(t)}>Quitar</Borrar>
        </div>
      ))}
      {/* Las unidades se van con el tono. Con el último eso deja el producto en
          cero, que es lo correcto pero conviene decirlo antes y no después. */}
      {p.tonos.length === 1 && (
        <p className="ayuda">
          Es el último tono. Si lo sacás, el producto queda sin stock y vas a
          tener que cargarlo a mano.
        </p>
      )}

      {error && <div className="pa-aviso mal" role="alert">{error}</div>}

      {nuevo ? (
        <div className="pa-nuevo-tono">
          <div className="pa-dos">
            <Campo id="t-nom" etiqueta="Nombre del tono">
              <input id="t-nom" value={nuevo.nombre} autoFocus
                onChange={(e) => setNuevo((x) => ({ ...x, nombre: e.target.value }))} />
            </Campo>
            <Campo id="t-stock" etiqueta="Stock">
              <input id="t-stock" type="number" min="0" inputMode="numeric" value={nuevo.stock}
                onChange={(e) => setNuevo((x) => ({ ...x, stock: e.target.value }))} />
            </Campo>
          </div>
          <div className="pa-dos">
            <Campo id="t-hex" etiqueta="Color">
              <input id="t-hex" type="color" value={nuevo.hex} className="pa-color"
                onChange={(e) => setNuevo((x) => ({ ...x, hex: e.target.value }))} />
            </Campo>
            <Campo id="t-fam" etiqueta="Familia de color" ayuda="Para agrupar tonos parecidos en el catálogo.">
              <select id="t-fam" value={nuevo.familia_id}
                onChange={(e) => setNuevo((x) => ({ ...x, familia_id: e.target.value }))}>
                <option value="">Sin familia</option>
                {familias.map((f) => <option key={f.id} value={f.id}>{f.nombre}</option>)}
              </select>
            </Campo>
          </div>
          <div className="pa-acciones">
            <button type="button" className="btn btn-primary" onClick={agregar} disabled={!nuevo.nombre.trim()}>
              Agregar tono
            </button>
            <button type="button" className="btn btn-ghost" onClick={() => { setNuevo(null); setError(null); }}>
              Cancelar
            </button>
          </div>
        </div>
      ) : (
        <button type="button" className="btn btn-ghost pa-sumar"
          onClick={() => setNuevo({ nombre: "", hex: HEX_NUEVO, familia_id: "", stock: 0 })}>
          Agregar un tono
        </button>
      )}
    </div>
  );
}

/* ---------- ficha de edición ----------
   Los campos son los mismos que la API acepta escribir, ni uno más: si acá
   apareciera uno que la lista blanca del servidor no tiene, se guardaría en
   silencio sin cambiar nada, que es la peor manera de fallar. */
const CAMPOS_FICHA = [
  ["nombre", "Nombre", "Esmalte Semipermanente x 15 ml", "text", null],
  ["marca", "Marca", "Pink Mask", "text", null],
  ["precio", "Precio", "12400", "number", null],
  ["precio_antes", "Precio anterior", "", "number", "Solo si está en oferta. Vacío si no."],
  ["contenido", "Contenido", "15 ml", "text", null],
  ["rinde", "Rinde", "Hasta 40 aplicaciones", "text", null],
  ["uso", "Cómo se usa", "Dos capas finas y 60 segundos de cabina", "text", null],
  ["envio", "Nota de envío", "Viaja con protección", "text", null],
];

function Ficha({ p, productos, categorias, familias, volver, recargar, avisar }) {
  const [v, setV] = useState(() => ({ ...p }));
  const [yendo, setYendo] = useState(false);
  const [error, setError] = useState(null);
  useEffect(() => { setV({ ...p }); }, [p]);

  const set = (k) => (e) => setV((x) => ({ ...x, [k]: e.target.value }));
  const cat = categorias.find((c) => c.id === v.categoria_id);

  /* Destacado y habitual no son un sí o un no: guardan la posición en la lista,
     porque el orden en que aparecen en la portada es una decisión. La casilla
     manda al final; para reordenar hace falta otra pantalla que hoy no existe. */
  const marcar = (campo) => (e) => setV((x) => ({
    ...x,
    [campo]: e.target.checked
      ? Math.max(0, ...productos.map((q) => q[campo] || 0)) + 1
      : null,
  }));

  const guardar = async () => {
    setYendo(true); setError(null);
    try {
      const cuerpo = {};
      for (const [k] of CAMPOS_FICHA) cuerpo[k] = v[k] ?? "";
      Object.assign(cuerpo, {
        descripcion: v.descripcion ?? "", color: v.color ?? "",
        categoria_id: v.categoria_id, sub_id: v.sub_id ?? "",
        destacado: v.destacado ?? null, habitual: v.habitual ?? null,
      });
      await api("/producto/" + p.id, { method: "PATCH", cuerpo });
      avisar("Guardado: " + v.nombre);
      recargar();
    } catch (e) { setError(e.message); }
    finally { setYendo(false); }
  };

  const borrar = async () => {
    try { await api("/producto/" + p.id, { method: "DELETE" }); avisar("Borrado: " + p.nombre); volver(); recargar(); }
    catch (e) { setError(e.message); }
  };

  const conTonos = p.tonos.length > 0;
  const listo = String(v.nombre || "").trim() && String(v.precio ?? "") !== "";

  return (
    <>
      <div className="pa-ficha-h">
        <button type="button" className="btn btn-ghost" onClick={volver}>← Volver a la lista</button>
        <span className="pa-marca">{p.id}</span>
      </div>

      <div className="pa-form">
        {CAMPOS_FICHA.map(([k, etiqueta, ejemplo, tipo, ayuda]) => (
          <Campo key={k} id={"f-" + k} etiqueta={etiqueta} ayuda={ayuda}>
            <input id={"f-" + k} type={tipo} value={v[k] ?? ""} placeholder={ejemplo}
              inputMode={tipo === "number" ? "numeric" : undefined} onChange={set(k)} />
          </Campo>
        ))}

        <Campo id="f-descripcion" etiqueta="Descripción">
          <textarea id="f-descripcion" value={v.descripcion ?? ""} onChange={set("descripcion")} />
        </Campo>

        <div className="pa-dos">
          <Campo id="f-cat" etiqueta="Categoría">
            <select id="f-cat" value={v.categoria_id || ""}
              onChange={(e) => setV((x) => ({ ...x, categoria_id: e.target.value, sub_id: "" }))}>
              {categorias.map((c) => <option key={c.id} value={c.id}>{c.nombre}</option>)}
            </select>
          </Campo>
          <Campo id="f-sub" etiqueta="Subcategoría">
            <select id="f-sub" value={v.sub_id || ""} onChange={set("sub_id")}>
              <option value="">Ninguna</option>
              {(cat ? cat.subs : []).map((s) => <option key={s.id} value={s.id}>{s.nombre}</option>)}
            </select>
          </Campo>
        </div>

        <Campo id="f-color" etiqueta="Color de la placa"
          ayuda="Es lo que se ve en la tarjeta mientras el producto no tenga foto.">
          <span className="pa-color-fila">
            <input id="f-color" type="color" className="pa-color" value={v.color || HEX_NUEVO} onChange={set("color")} />
            <input value={v.color || ""} placeholder="Sin color" onChange={set("color")} aria-label="Color en hexadecimal" />
            {v.color && <button type="button" className="pa-cancela"
              onClick={() => setV((x) => ({ ...x, color: "" }))}>Sacar</button>}
          </span>
        </Campo>

        <div className="pa-marcas">
          <label className="pa-chk">
            <input type="checkbox" checked={v.destacado != null} onChange={marcar("destacado")} />
            <span>Sale en <b>Destacados</b> de la portada</span>
          </label>
          <label className="pa-chk">
            <input type="checkbox" checked={v.habitual != null} onChange={marcar("habitual")} />
            <span>Entra en <b>Lo de siempre</b></span>
          </label>
        </div>

        {!conTonos && (
          <div className="pa-stock">
            <span className="lbl">Stock</span>
            <Stock valor={p.stock} onGuardar={async (n) => {
              await api("/producto/" + p.id, { method: "PATCH", cuerpo: { stock: n } });
              avisar(`Stock de ${p.nombre}: ${n}`); recargar();
            }} />
          </div>
        )}

        <Tonos p={p} familias={familias} recargar={recargar} avisar={avisar} />

        {error && <div className="pa-aviso mal" role="alert">{error}</div>}

        <div className="pa-peligro">
          <Borrar que={p.nombre} onBorrar={borrar}>Borrar este producto</Borrar>
          <span className="ayuda">Los pedidos que ya lo tenían siguen mostrándolo.</span>
        </div>
      </div>

      <div className="pa-guardar">
        <button className="btn btn-primary" onClick={guardar} disabled={yendo || !listo} style={{ minHeight: 48 }}>
          {yendo ? "Guardando…" : "Guardar cambios"}
        </button>
        {!listo && <span className="estado">Falta el nombre o el precio</span>}
      </div>
    </>
  );
}

/* ---------- alta de producto ---------- */
function Nuevo({ categorias, volver, recargar, avisar, abrir }) {
  const [v, setV] = useState({ nombre: "", marca: "", precio: "", categoria_id: categorias[0] ? categorias[0].id : "", sub_id: "", stock: 0 });
  const [yendo, setYendo] = useState(false);
  const [error, setError] = useState(null);
  const cat = categorias.find((c) => c.id === v.categoria_id);

  const crear = async () => {
    setYendo(true); setError(null);
    try {
      const { id } = await api("/producto", { method: "POST", cuerpo: v });
      avisar("Creado: " + v.nombre);
      await recargar();
      abrir(id);
    } catch (e) { setError(e.message); setYendo(false); }
  };

  return (
    <>
      <div className="pa-ficha-h">
        <button type="button" className="btn btn-ghost" onClick={volver}>← Volver a la lista</button>
      </div>
      <div className="pa-aviso">
        Con esto alcanza para crearlo. Lo demás —descripción, contenido, tonos—
        se carga después en la ficha.
      </div>
      <div className="pa-form">
        <Campo id="n-nom" etiqueta="Nombre">
          <input id="n-nom" value={v.nombre} autoFocus placeholder="Esmalte Semipermanente x 15 ml"
            onChange={(e) => setV((x) => ({ ...x, nombre: e.target.value }))} />
        </Campo>
        <div className="pa-dos">
          <Campo id="n-marca" etiqueta="Marca">
            <input id="n-marca" value={v.marca} placeholder="Pink Mask"
              onChange={(e) => setV((x) => ({ ...x, marca: e.target.value }))} />
          </Campo>
          <Campo id="n-precio" etiqueta="Precio">
            <input id="n-precio" type="number" min="0" inputMode="numeric" value={v.precio} placeholder="12400"
              onChange={(e) => setV((x) => ({ ...x, precio: e.target.value }))} />
          </Campo>
        </div>
        <div className="pa-dos">
          <Campo id="n-cat" etiqueta="Categoría">
            <select id="n-cat" value={v.categoria_id}
              onChange={(e) => setV((x) => ({ ...x, categoria_id: e.target.value, sub_id: "" }))}>
              {categorias.map((c) => <option key={c.id} value={c.id}>{c.nombre}</option>)}
            </select>
          </Campo>
          <Campo id="n-sub" etiqueta="Subcategoría">
            <select id="n-sub" value={v.sub_id} onChange={(e) => setV((x) => ({ ...x, sub_id: e.target.value }))}>
              <option value="">Ninguna</option>
              {(cat ? cat.subs : []).map((s) => <option key={s.id} value={s.id}>{s.nombre}</option>)}
            </select>
          </Campo>
        </div>
        <Campo id="n-stock" etiqueta="Stock inicial">
          <input id="n-stock" type="number" min="0" inputMode="numeric" value={v.stock}
            onChange={(e) => setV((x) => ({ ...x, stock: e.target.value }))} />
        </Campo>
        {error && <div className="pa-aviso mal" role="alert">{error}</div>}
      </div>
      <div className="pa-guardar">
        <button className="btn btn-primary" onClick={crear} style={{ minHeight: 48 }}
          disabled={yendo || !v.nombre.trim() || v.precio === ""}>
          {yendo ? "Creando…" : "Crear producto"}
        </button>
      </div>
    </>
  );
}

/* ---------- lista de productos ---------- */
function Productos({ productos, categorias, familias, recargar, avisar }) {
  const [q, setQ] = useState("");
  const [viendo, setViendo] = useState(null);   // id del producto abierto, o "nuevo"

  /* Si el producto abierto dejó de existir —lo borré desde su propia ficha— la
     vista vuelve sola a la lista en vez de quedarse en una ficha vacía. */
  useEffect(() => {
    if (viendo && viendo !== "nuevo" && !productos.some((p) => p.id === viendo)) setViendo(null);
  }, [viendo, productos]);

  /* Cambiar de pantalla lleva arriba. Sin esto se hereda el scroll de la
     anterior: al crear un producto desde el final del formulario, su ficha
     abría por la mitad, y entrar a editar el producto cuarenta de la lista
     dejaba la ficha empezada a la altura de los tonos. */
  useEffect(() => { window.scrollTo(0, 0); }, [viendo]);

  const filtro = q.trim().toLowerCase();
  const lista = filtro
    ? productos.filter((p) => (p.nombre + " " + (p.marca || "")).toLowerCase().includes(filtro))
    : productos;

  if (viendo === "nuevo") return (
    <Nuevo categorias={categorias} volver={() => setViendo(null)} recargar={recargar}
      avisar={avisar} abrir={setViendo} />
  );

  const abierto = productos.find((p) => p.id === viendo);
  if (abierto) return (
    <Ficha p={abierto} productos={productos} categorias={categorias} familias={familias}
      volver={() => setViendo(null)} recargar={recargar} avisar={avisar} />
  );

  const guardarStock = (p) => async (n) => {
    await api("/producto/" + p.id, { method: "PATCH", cuerpo: { stock: n } });
    avisar(`Stock de ${p.nombre}: ${n}`);
    recargar();
  };
  const guardarTono = (p, t) => async (n) => {
    await api("/tono/" + p.id, { method: "PATCH", cuerpo: { nombre: t.nombre, stock: n } });
    avisar(`${p.nombre} · ${t.nombre}: ${n}`);
    recargar();
  };

  return (
    <>
      <div className="pa-buscar">
        <input value={q} onChange={(e) => setQ(e.target.value)}
          placeholder="Buscar producto o marca…" aria-label="Buscar producto" />
        <button type="button" className="btn btn-primary" onClick={() => setViendo("nuevo")}>Nuevo producto</button>
      </div>
      <div className="pa-lista">
        {lista.map((p) => {
          const conTonos = p.tonos.length > 0;
          const total = conTonos ? p.tonos.reduce((a, t) => a + t.stock, 0) : p.stock;
          return (
            <div className="pa-fila" key={p.id}>
              <div className="pa-fila-h">
                <span className="pa-mini">
                  {p.img ? <img src={"../" + p.img} alt="" />
                    : <span className="pa-mini-color" style={{ display: "block", background: p.color || "var(--nude-100)" }}></span>}
                </span>
                <span style={{ minWidth: 0 }}>
                  <span className="pa-marca">{p.marca || "Sin marca"}</span>
                  <span className="pa-nom" style={{ display: "block" }}>{p.nombre}</span>
                </span>
                <span className="pa-precio">{plata(p.precio)}</span>
              </div>

              <div className="pa-stock">
                <span className="lbl">Stock</span>
                <span className={total === 0 ? "pa-agotado" : ""} style={{ fontSize: ".85rem" }}>
                  {total === 0 ? "Agotado" : total + " unidades"}
                  {conTonos && " · suma de los tonos"}
                </span>
                {/* Con tonos el total es la suma: se edita tono por tono, si no
                    quedarían dos números diciendo cosas distintas. */}
                {!conTonos && <Stock valor={p.stock} onGuardar={guardarStock(p)} />}
              </div>

              {conTonos && (
                <div className="pa-tonos">
                  {p.tonos.map((t) => (
                    <div className="pa-tono" key={t.nombre}>
                      <s style={{ background: t.hex }}></s>
                      <span className="pa-tono-nom">{t.nombre}</span>
                      <Stock valor={t.stock} onGuardar={guardarTono(p, t)} />
                    </div>
                  ))}
                </div>
              )}

              <button type="button" className="btn btn-ghost pa-editar" onClick={() => setViendo(p.id)}>
                Editar la ficha
              </button>
            </div>
          );
        })}
        {!lista.length && <p className="pa-vacio">No hay productos que coincidan.</p>}
      </div>
    </>
  );
}

/* ---------- pedidos ---------- */
const ESTADOS = { nuevo: "Nuevo", confirmado: "Confirmado", cancelado: "Cancelado" };

function Pedidos({ avisar }) {
  const [pedidos, setPedidos] = useState(null);
  const [filtro, setFiltro] = useState("nuevo");
  const [error, setError] = useState(null);
  const [yendo, setYendo] = useState(null);

  const cargar = useCallback(async () => {
    try { setPedidos((await api("/pedidos?estado=" + filtro)).pedidos); setError(null); }
    catch (e) { setError(e.message); }
  }, [filtro]);
  useEffect(() => { cargar(); }, [cargar]);

  const cerrar = async (p, accion) => {
    setYendo(p.id);
    try {
      await api(`/pedido/${p.id}/${accion}`, { method: "POST" });
      avisar(accion === "confirmar"
        ? `Pedido #${p.id} confirmado. El stock ya bajó.`
        : `Pedido #${p.id} cancelado. El stock quedó igual.`);
      cargar();
    } catch (e) { setError(e.message); }
    finally { setYendo(null); }
  };

  const fecha = (ms) => new Date(ms).toLocaleString("es-AR",
    { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });

  return (
    <>
      <nav className="pa-tabs" aria-label="Estado de los pedidos">
        {Object.entries(ESTADOS).map(([id, txt]) => (
          <button key={id} aria-current={filtro === id ? "page" : undefined} onClick={() => setFiltro(id)}>{txt}</button>
        ))}
      </nav>
      {error && <div className="pa-aviso mal" role="alert">{error}</div>}
      {!pedidos ? <p className="pa-vacio">Cargando…</p>
        : !pedidos.length ? <p className="pa-vacio">No hay pedidos {ESTADOS[filtro].toLowerCase()}s.</p>
        : (
        <div className="pa-lista">
          {pedidos.map((p) => (
            <div className="pa-fila" key={p.id}>
              <div className="pa-fila-h">
                <span style={{ minWidth: 0 }}>
                  <span className="pa-marca">#{String(p.id).padStart(4, "0")} · {fecha(p.creado)}</span>
                  <span className="pa-nom" style={{ display: "block" }}>{p.nombre || "Sin nombre"}</span>
                  {p.telefono && <a className="pa-tel" href={"https://wa.me/" + p.telefono.replace(/\D/g, "")}
                    target="_blank" rel="noopener">{p.telefono}</a>}
                </span>
                <span className="pa-precio">{plata(p.total)}</span>
              </div>

              <ul className="pa-items">
                {p.items.map((i, j) => (
                  <li key={j}>
                    <b>{i.cantidad}&times;</b> {i.nombre}{i.tono ? ` · ${i.tono}` : ""}
                    <span>{plata(i.precio * i.cantidad)}</span>
                  </li>
                ))}
              </ul>

              <p className="pa-envio">
                {p.envio_modo === "domicilio" ? `Envío a domicilio${p.envio_zona ? " · " + p.envio_zona : ""}`
                  : p.envio_modo === "retiro" ? "Retira en el local" : "Por transporte"}
                {p.envio_costo === null ? " · a cotizar" : p.envio_costo === 0 ? " · sin cargo" : " · " + plata(p.envio_costo)}
                {p.direccion ? ` · ${p.direccion}` : ""}
              </p>
              {p.nota && <p className="pa-nota">Nota: {p.nota}</p>}

              {p.estado === "nuevo" ? (
                <div className="pa-acciones">
                  {/* Confirmar descuenta el stock; cancelar no toca nada. */}
                  <button className="btn btn-primary" disabled={yendo === p.id} onClick={() => cerrar(p, "confirmar")}>
                    {yendo === p.id ? "Guardando…" : "Confirmar y descontar stock"}
                  </button>
                  <button className="pa-salir" disabled={yendo === p.id} onClick={() => cerrar(p, "cancelar")}>Cancelar</button>
                </div>
              ) : (
                <p className="pa-estado" data-estado={p.estado}>
                  {ESTADOS[p.estado]}{p.cerrado ? " el " + fecha(p.cerrado) : ""}
                  {p.estado === "confirmado" && " · el stock ya bajó"}
                </p>
              )}
            </div>
          ))}
        </div>
      )}
    </>
  );
}

/* ---------- datos del negocio ---------- */
const CAMPOS_NEGOCIO = [
  ["whatsapp", "WhatsApp", "Con código de país y sin signos: 5493415551234", "tel"],
  ["instagramUsuario", "Usuario de Instagram", "@geainsumos", "text"],
  ["instagram", "Link de Instagram", "https://instagram.com/geainsumos", "url"],
  ["ciudad", "Ciudad", "Rosario, Santa Fe", "text"],
  ["horarios", "Horarios", "Lunes a viernes de 9 a 18", "text"],
  ["minimo", "Pedido mínimo", "25000", "number"],
  ["envioGratisDesde", "Envío sin cargo desde", "120000", "number"],
];

function Negocio({ config, recargar, avisar }) {
  const [v, setV] = useState(() => ({ ...config }));
  const [yendo, setYendo] = useState(false);
  const [error, setError] = useState(null);
  useEffect(() => { setV({ ...config }); }, [config]);

  const guardar = async () => {
    setYendo(true); setError(null);
    try {
      const cuerpo = {};
      for (const [k] of CAMPOS_NEGOCIO) cuerpo[k] = v[k] ?? "";
      await api("/config", { method: "PATCH", cuerpo });
      avisar("Datos del negocio guardados");
      recargar();
    } catch (e) { setError(e.message); }
    finally { setYendo(false); }
  };

  /* El número va tal cual al link wa.me, que necesita el número internacional
     completo. Antes esto solo miraba si era el de relleno, y dejó pasar uno
     real pero sin código de país: wa.me devolvía "Chat on WhatsApp with
     3416012708" en vez de resolverlo, y ningún pedido llegaba a ningún lado.
     Un número que parece bien es peor que uno vacío, porque nadie lo revisa. */
  const wa = String(v.whatsapp || "").replace(/\D/g, "");
  const problemaWa =
    !wa || wa.startsWith("549000") ? "relleno" :
    wa.length < 11 ? "corto" :
    !wa.startsWith("54") ? "sinPais" :
    wa.startsWith("54") && !wa.startsWith("549") ? "sinNueve" : null;
  /* La sugerencia solo agrega lo que falta adelante; los dígitos son los que
     ya estaban. */
  const sugerencia = problemaWa === "sinPais" ? "549" + wa
    : problemaWa === "sinNueve" ? "549" + wa.slice(2) : null;

  const AVISOS = {
    relleno: "El número de WhatsApp todavía es el de relleno. Hasta que lo cargues, los pedidos no le llegan a nadie.",
    corto: "Ese número es demasiado corto para WhatsApp. Va completo, con código de país y de área.",
    sinPais: "Falta el código de país. WhatsApp necesita el número internacional entero, si no el link no abre ningún chat.",
    sinNueve: "Para un celular argentino WhatsApp pide el 9 después del 54.",
  };

  return (
    <>
      {problemaWa && (
        <div className="pa-aviso mal">
          <span>
            {AVISOS[problemaWa]}
            {sugerencia && <>
              {" "}Debería ser <b>{sugerencia}</b>.{" "}
              <button type="button" className="pa-cancela" style={{ marginTop: ".4rem" }}
                onClick={() => setV((x) => ({ ...x, whatsapp: sugerencia }))}>
                Poner {sugerencia}
              </button>
            </>}
          </span>
        </div>
      )}
      {/* Para comprobarlo sin adivinar: abre el chat con el número que está
          guardado. Si no abre tu WhatsApp, está mal. */}
      {!problemaWa && wa && (
        <div className="pa-aviso">
          <span>
            El link que van a tocar tus clientas es <b>wa.me/{wa}</b>.{" "}
            <a href={"https://wa.me/" + wa} target="_blank" rel="noopener">Probalo</a>: tiene que abrir tu chat.
          </span>
        </div>
      )}
      <div className="pa-form">
        {CAMPOS_NEGOCIO.map(([k, etiqueta, ejemplo, tipo]) => (
          <div className="pa-campo" key={k}>
            <label htmlFor={k}>{etiqueta}</label>
            <input id={k} type={tipo} value={v[k] ?? ""} placeholder={ejemplo}
              inputMode={tipo === "number" ? "numeric" : undefined}
              onChange={(e) => setV((x) => ({ ...x, [k]: e.target.value }))} />
            <span className="ayuda">Ejemplo: {ejemplo}</span>
          </div>
        ))}
        {error && <div className="pa-aviso mal" role="alert">{error}</div>}
      </div>
      <div className="pa-guardar">
        <button className="btn btn-primary" onClick={guardar} disabled={yendo} style={{ minHeight: 48 }}>
          {yendo ? "Guardando…" : "Guardar cambios"}
        </button>
      </div>
    </>
  );
}

/* ---------- zonas de envío ---------- */
function Envios({ zonas, recargar, avisar }) {
  const [v, setV] = useState(() => zonas.map((z) => ({ ...z })));
  const [yendo, setYendo] = useState(false);
  const [error, setError] = useState(null);
  useEffect(() => { setV(zonas.map((z) => ({ ...z }))); }, [zonas]);

  const guardar = async () => {
    setYendo(true); setError(null);
    try {
      for (const z of v) {
        await api("/zona/" + z.id, {
          method: "PATCH",
          cuerpo: { nombre: z.nombre, costo: z.costo === "" || z.costo === null ? null : Number(z.costo), plazo: z.plazo },
        });
      }
      avisar("Zonas de envío guardadas");
      recargar();
    } catch (e) { setError(e.message); }
    finally { setYendo(false); }
  };

  return (
    <>
      <div className="pa-aviso">
        Dejá el costo vacío si esa zona se cotiza por chat. No es lo mismo que
        poner cero, que significa sin cargo.
      </div>
      <div className="pa-form">
        {v.map((z, i) => (
          <div className="pa-fila" key={z.id}>
            <div className="pa-campo">
              <label htmlFor={`z-nom-${z.id}`}>Nombre de la zona</label>
              <input id={`z-nom-${z.id}`} value={z.nombre || ""} onChange={(e) => setV((x) => x.map((y, j) => j === i ? { ...y, nombre: e.target.value } : y))} />
            </div>
            <div className="pa-dos">
              <div className="pa-campo">
                <label htmlFor={`z-costo-${z.id}`}>Costo</label>
                <input id={`z-costo-${z.id}`} type="number" inputMode="numeric" value={z.costo ?? ""} placeholder="A cotizar"
                  onChange={(e) => setV((x) => x.map((y, j) => j === i ? { ...y, costo: e.target.value } : y))} />
              </div>
              <div className="pa-campo">
                <label htmlFor={`z-plazo-${z.id}`}>Plazo</label>
                <input id={`z-plazo-${z.id}`} value={z.plazo || ""} placeholder="2 a 4 días"
                  onChange={(e) => setV((x) => x.map((y, j) => j === i ? { ...y, plazo: e.target.value } : y))} />
              </div>
            </div>
          </div>
        ))}
        {error && <div className="pa-aviso mal" role="alert">{error}</div>}
      </div>
      <div className="pa-guardar">
        <button className="btn btn-primary" onClick={guardar} disabled={yendo} style={{ minHeight: 48 }}>
          {yendo ? "Guardando…" : "Guardar zonas"}
        </button>
      </div>
    </>
  );
}

/* ---------- armazón ---------- */
function Panel({ onSalir }) {
  const [tab, setTab] = useState("pedidos");
  const [datos, setDatos] = useState(null);
  const [error, setError] = useState(null);
  const [aviso, setAviso] = useState(null);

  const cargar = useCallback(async () => {
    try {
      const [prods, cat] = await Promise.all([api("/productos"), fetch("/api/catalogo").then((r) => r.json())]);
      setDatos({
        productos: prods.productos, negocio: cat.NEGOCIO, envio: cat.ENVIO,
        categorias: cat.CATEGORIAS, familias: cat.FAMILIAS,
      });
      setError(null);
    } catch (e) { setError(e.message); }
  }, []);
  useEffect(() => { cargar(); }, [cargar]);
  useEffect(() => { window.scrollTo(0, 0); }, [tab]);

  const avisar = (txt) => { setAviso(txt); setTimeout(() => setAviso(null), 2600); };

  const salir = async () => { await api("/salir", { method: "POST" }).catch(() => {}); onSalir(); };

  if (error) return (
    <div className="pa">
      <div className="pa-aviso mal" style={{ marginTop: "2rem" }} role="alert">{error}</div>
      <div style={{ padding: "0 1rem" }}>
        <button className="btn btn-primary" onClick={cargar}>Reintentar</button>
      </div>
    </div>
  );
  if (!datos) return <p className="pa-vacio">Cargando…</p>;

  const config = {
    ...datos.negocio,
    envioGratisDesde: datos.envio.gratisDesde,
  };

  return (
    <div className="pa">
      <header className="pa-barra">
        <span>
          <span className="lbl">GEA Insumos</span>
          <h1>Panel</h1>
        </span>
        <button className="pa-salir" onClick={salir}>Salir</button>
      </header>

      {/* Sin role="tablist": pisaba el landmark del nav, y además prometía un
          widget de pestañas de verdad (navegación con flechas, paneles
          asociados) que no hay. Son botones de navegación, y aria-current
          dice cuál está abierto. */}
      <nav className="pa-tabs" aria-label="Secciones del panel">
        {[["pedidos", "Pedidos"], ["productos", "Productos y stock"], ["negocio", "Datos del negocio"], ["envios", "Envíos"]].map(([id, txt]) => (
          <button key={id} aria-current={tab === id ? "page" : undefined} onClick={() => setTab(id)}>{txt}</button>
        ))}
      </nav>

      <main>
        {aviso && <div className="pa-aviso bien" role="status">{aviso}</div>}
        {tab === "pedidos" && <Pedidos avisar={avisar} />}
        {tab === "productos" && <Productos productos={datos.productos} categorias={datos.categorias}
          familias={datos.familias} recargar={cargar} avisar={avisar} />}
        {tab === "negocio" && <Negocio config={config} recargar={cargar} avisar={avisar} />}
        {tab === "envios" && <Envios zonas={datos.envio.zonas} recargar={cargar} avisar={avisar} />}
      </main>
    </div>
  );
}

function App() {
  const [sesion, setSesion] = useState(null);   // null = averiguando
  useEffect(() => {
    api("/sesion").then((d) => setSesion(!!d.activa)).catch(() => setSesion(false));
  }, []);
  if (sesion === null) return <p className="pa-vacio">Cargando…</p>;
  return sesion
    ? <Panel onSalir={() => setSesion(false)} />
    : <Entrar onEntro={() => setSesion(true)} />;
}

ReactDOM.createRoot(document.getElementById("raiz")).render(<App />);
})();
</script>
