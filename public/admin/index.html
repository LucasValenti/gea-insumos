<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · GEA Insumos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<!-- Las familias venían por un @import adentro de tokens/fonts.css. Salió de ahí
     para no encadenar cinco viajes antes de la primera letra, así que el panel
     también las pide acá: si no, hereda Times New Roman. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="admin.css">
<script>
/* Mismo criterio que la tienda: el tema se estampa antes de pintar. */
(function () {
  var v = {};
  try { v = JSON.parse(localStorage.getItem("gea_ver_v1")) || {}; } catch (e) {}
  var attr = { claro: "light", oscuro: "dark" }[v.tema];
  if (attr) document.documentElement.setAttribute("data-theme", attr);
})();
</script>
</head>
<body>
<div id="raiz"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="panel.js"></script>
</body></html>
