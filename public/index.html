<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Las direcciones de este archivo van desde la raíz, con la barra adelante, y
     no relativas. Con "app.js" el navegador lo resuelve contra la dirección que
     está mirando: desde / daba bien, pero src/paginas.js sirve este mismo
     armazón en /p/<producto>, y ahí pasaba a pedir "/p/app.js". Los nueve
     scripts daban 404 y la página de cada producto —la que se comparte por
     WhatsApp y la que el sitemap le declara a Google— salía en blanco.
     Un <base href="/"> lo arreglaría de una, pero la CSP trae base-uri 'none'
     a propósito, y aflojar eso para acomodar una ruta sale más caro. -->
<title>GEA Insumos · Insumos de belleza por mayor</title>
<meta name="description" content="Insumos de belleza por mayor: herramientas, descartables y productos para profesionales. Stock y tiempos de envío a la vista, sin pedir precio por chat. El pedido se cierra por WhatsApp.">
<link rel="canonical" href="https://gea-insumos.kusak.workers.dev/">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#E2C2B9">

<!-- Vista previa al compartir. Importa más que el buscador: acá los links
     circulan por WhatsApp e Instagram, y sin esto se veía una tarjeta vacía. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="GEA Insumos">
<meta property="og:locale" content="es_AR">
<meta property="og:title" content="GEA Insumos · Insumos de belleza por mayor">
<meta property="og:description" content="Herramientas, descartables y productos de belleza para profesionales. Stock y tiempos de envío a la vista, sin pedir precio por chat.">
<meta property="og:url" content="https://gea-insumos.kusak.workers.dev/">
<meta property="og:image" content="https://gea-insumos.kusak.workers.dev/assets/og-gea.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Manos con uñas esculpidas sobre un muestrario de tips">
<meta name="twitter:card" content="summary_large_image">
<!-- Acá había preconexiones a unpkg y a cdnjs. Ya no hacen falta: React y
     animate.css se sirven de este mismo dominio, por la conexión que el
     navegador ya abrió para pedir esta página. -->
<!-- Las @font-face ya no vienen de una hoja de fonts.googleapis.com: están
     adentro de estilos.css, traídas por herramientas/vendor.mjs. Esa hoja pesaba
     1385 bytes y costaba 844 ms, porque era DNS + TCP + TLS a un origen nuevo
     antes siquiera de saber qué archivo de fuente pedir, y bloqueaba el pintado.
     Los .woff2 siguen saliendo de gstatic —no hay binarios de fuente en el
     repo— pero ahora se descubren leyendo un CSS que ya venía viajando, y con
     display=swap no bloquean nada. Por eso queda solo esta preconexión. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- La foto del hero es lo más grande de la primera pantalla, o sea la métrica
     que Google mira. Sin este preload no se podía ni pedir hasta que React
     montaba y llegaba el catálogo: medido, se descubría recién a los 3,1 s
     estando el html en el navegador desde los 40 ms. Acá baja en paralelo con
     todo lo demás. -->
<link rel="preload" as="image" href="/tienda/img/hero.webp" fetchpriority="high">
<!-- Uno solo. Eran diez: styles.css encadenaba ocho @import, que no se descubren
     al leer el html —hay que bajar y parsear styles.css primero— y bloquean el
     pintado los diez. Los fuentes siguen partidos en tokens y base; los junta
     herramientas/compilar.mjs, igual que el JSX. -->
<link rel="stylesheet" href="/estilos.css">
<!-- Venía de cdnjs con integrity. Ahora es nuestro: lo baja y lo verifica
     herramientas/vendor.mjs contra el mismo sha384 que tenía el atributo, así
     que la copia está probada byte a byte contra lo que servía el CDN. Sin
     integrity porque ya no aplica: el archivo sale del mismo origen que la
     página. La versión va en el nombre para que actualizar sea una dirección
     nueva y nadie quede servido con una copia vieja. -->
<link rel="stylesheet" href="/vendor/animate-4.1.1.min.css">
<style>
/* Animate.css afinado al sistema: duraciones cortas y curva de la marca. */
:root{--animate-duration:.5s;--animate-delay:.1s}
.animate__animated{animation-timing-function:cubic-bezier(.22,.72,.24,1)}
.animate__bounceIn,.animate__headShake{animation-timing-function:initial}
body{background:var(--sunk);margin:0}
#root{min-height:100vh}
.escenario{min-height:100vh;display:grid;place-items:center;padding:2rem 1rem;background:var(--sunk)}
.enmarcado .ap{--h-tabs:80px}
.enmarcado .barra-bot{padding-bottom:24px}
.toast{position:fixed;left:0;right:0;width:max-content;margin-inline:auto;bottom:5.5rem;z-index:70;background:var(--ink);color:var(--paper);border-radius:var(--radio);padding:.7rem .9rem;font-size:.8rem;display:flex;gap:.9rem;align-items:center;box-shadow:var(--shadow-flotante);max-width:calc(100% - 2rem);--animate-duration:.34s}
.toast button{border:0;background:transparent;color:var(--nude-200);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.enmarcado .toast{position:absolute}
a{color:var(--ink)}a:hover{color:var(--nude-600)}
.btn:disabled{opacity:.45;cursor:not-allowed}
</style>
<script>
/* El tema elegido se estampa antes de pintar. Dentro de React llegaría tres
   segundos tarde —lo que tarda Babel en compilar— y ese rato se vería blanco. */
(function () {
  var v = {};
  try { v = JSON.parse(localStorage.getItem("gea_ver_v1")) || {}; } catch (e) {}
  var attr = { claro: "light", oscuro: "dark" }[v.tema];
  /* Sin atributo manda prefers-color-scheme, que es el valor por defecto. */
  if (attr) document.documentElement.setAttribute("data-theme", attr);
  /* Las secciones aparecen al entrar en pantalla, y para eso arrancan en
     opacity 0 esperando que el JS les ponga .vis. Si el navegador no tiene
     IntersectionObserver, o algo falla antes, quedaban invisibles para
     siempre. El estado invisible ahora vive detrás de esta clase: se estampa
     acá, antes de pintar —así no hay parpadeo— y solo cuando sabemos que se
     puede animar. Sin ella el contenido se ve igual, sin animación. */
  if (window.IntersectionObserver) document.documentElement.classList.add("rev-on");
})();
</script>
<!-- Solo lo que es verdad hoy. Ni dirección, ni teléfono, ni horarios: en
     datos.js siguen siendo valores de relleno, y declararlos inventados es
     peor que no declararlos. Entran cuando se carguen de verdad. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://gea-insumos.kusak.workers.dev/#negocio",
      "name": "GEA Insumos",
      "description": "Insumos de belleza por mayor: herramientas, descartables y productos para profesionales.",
      "url": "https://gea-insumos.kusak.workers.dev/",
      "image": "https://gea-insumos.kusak.workers.dev/assets/og-gea.jpg",
      "logo": "https://gea-insumos.kusak.workers.dev/assets/favicon.svg"
    },
    {
      "@type": "WebSite",
      "url": "https://gea-insumos.kusak.workers.dev/",
      "name": "GEA Insumos",
      "inLanguage": "es-AR",
      "publisher": { "@id": "https://gea-insumos.kusak.workers.dev/#negocio" }
    }
  ]
}
</script>
</head>
<body>
<div id="root"></div>
<!-- React salía de unpkg. Cada origen ajeno cuesta DNS, TCP y TLS antes del
     primer byte, y estos dos bloquean el pintado: Lighthouse los midió en
     1019 ms y 693 ms con 4G y CPU frenada. Los baja y los verifica
     herramientas/vendor.mjs contra el sha384 que tenían de integrity. -->

<!-- Todos con defer, y por eso siguen acá abajo y no en el <head>: defer conserva
     el orden de ejecución, que acá es obligatorio —cada archivo se cuelga de
     window y el siguiente lo usa—, pero deja de frenar al parser. Estando al
     final del body igual bloqueaban: Lighthouse los contaba a los ocho como
     render-blocking, 305 ms cada uno. Con defer bajan en paralelo con el CSS y
     corren cuando la página terminó de leerse.
     No pongas async: async no respeta el orden y app.js correría antes que
     React. -->
<script defer src="/vendor/react-18.3.1.min.js"></script>
<script defer src="/vendor/react-dom-18.3.1.min.js"></script>
<script defer src="/tienda/datos.js"></script>
<!-- Medidas reales de cada foto, para reservar el lugar antes de que carguen.
     Lo genera herramientas/imagenes.mjs; no se edita a mano. -->
<script defer src="/tienda/img/medidas.js"></script>
<!-- Estos cuatro los genera herramientas/compilar.mjs desde los .jsx de al lado.
     Antes venían como type="text/babel" y los iba a buscar Babel por XHR
     después de bajarse él mismo, así que el navegador no podía adelantarlos: la
     foto del hero recién se descubría al final de toda esa cadena. Ahora son
     scripts comunes y el preload scanner los ve al leer el html.

     Acá estaban también tweaks-panel.js y ios-frame.js, que son de prototipado:
     el panel de opciones de diseño y el marco de iPhone. Nunca se veían en la
     tienda publicada —vista arranca en "escritorio" y el panel solo abre si un
     anfitrión lo activa— pero se bajaban y se ejecutaban en cada visita, y
     Lighthouse los midió bloqueando el pintado 622 ms y 468 ms. Los archivos
     siguen publicados: las herramientas de auditoría los inyectan cuando el
     caso los necesita, y así lo que se audita es lo que se sirve. -->
<script defer src="/tienda/ui.js"></script>
<script defer src="/tienda/pantallas-tienda.js"></script>
<script defer src="/tienda/pantallas-pedido.js"></script>
<script defer src="/app.js"></script>
</body></html>
